<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient -->
    <linearGradient id="drdoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3d87"/>
      <stop offset="50%" stop-color="#0b316f"/>
      <stop offset="100%" stop-color="#072252"/>
    </linearGradient>

    <!-- Center Glow / Cream Fill -->
    <radialGradient id="centerCream" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#fffde8"/>
      <stop offset="100%" stop-color="#f5eebc"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>

    <!-- Curved Text Paths -->
    <!-- DRDO Top Text Path -->
    <path id="topDrdoArc" d="M 50,200 A 150,150 0 1,1 350,200" fill="none"/>
    <!-- DRDO Bottom Text Path -->
    <path id="bottomDrdoArc" d="M 350,200 A 150,150 0 0,1 50,200" fill="none"/>

    <!-- Inner Top Text Arc -->
    <path id="innerTopArc" d="M 85,200 A 115,115 0 1,1 315,200" fill="none"/>
    <!-- Inner Bottom Text Arc -->
    <path id="innerBottomArc" d="M 315,200 A 115,115 0 0,1 85,200" fill="none"/>
  </defs>

  <!-- 1. Outer Dark Blue Ring -->
  <circle cx="200" cy="200" r="192" fill="url(#drdoBlue)" stroke="#1a52a5" stroke-width="3"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

  <!-- Outer Ring White Text: D R D O -->
  <text font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="18">
    <textPath href="#topDrdoArc" startOffset="50%" text-anchor="middle">
      D R D O
    </textPath>
  </text>
  <text font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="18">
    <textPath href="#bottomDrdoArc" startOffset="50%" text-anchor="middle">
      D R D O
    </textPath>
  </text>

  <!-- Stars on Outer Ring (Left & Right) -->
  <!-- Left White Star -->
  <polygon points="40,200 44,192 53,192 46,197 48,206 40,201 32,206 34,197 27,192 36,192" fill="#ffffff"/>
  <!-- Right White Star -->
  <polygon points="360,200 364,192 373,192 366,197 368,206 360,201 352,206 354,197 347,192 356,192" fill="#ffffff"/>

  <!-- 2. White Separation Ring -->
  <circle cx="200" cy="200" r="142" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- 3. Inner Cream Background Circle -->
  <circle cx="200" cy="200" r="136" fill="url(#centerCream)" stroke="#111111" stroke-width="2"/>
  <circle cx="200" cy="200" r="102" fill="none" stroke="#111111" stroke-width="1.5"/>

  <!-- Inner Curved Text: DEFENCE R&D ORGANISATION -->
  <text font-family="'Arial Black', Arial, sans-serif" font-weight="800" font-size="14" fill="#111111" letter-spacing="1.5">
    <textPath href="#innerTopArc" startOffset="50%" text-anchor="middle">
      DEFENCE R&amp;D ORGANISATION
    </textPath>
  </text>

  <!-- Inner Curved Text: MINISTRY OF DEFENCE -->
  <text font-family="'Arial Black', Arial, sans-serif" font-weight="800" font-size="14" fill="#111111" letter-spacing="2">
    <textPath href="#innerBottomArc" startOffset="50%" text-anchor="middle">
      MINISTRY OF DEFENCE
    </textPath>
  </text>

  <!-- Red Small Stars on White Border -->
  <polygon points="98,232 101,225 108,225 102,229 104,236 98,232 92,236 94,229 88,225 95,225" fill="#d32f2f"/>
  <polygon points="302,232 305,225 312,225 306,229 308,236 302,232 296,236 298,229 292,225 299,225" fill="#d32f2f"/>

  <!-- 4. CENTER EMBLEM GRAPHICS -->

  <!-- A. Ashoka Lion Capital (Top Center Motif) -->
  <g transform="translate(182, 115) scale(0.35)">
    <!-- Base Pedestal -->
    <rect x="10" y="80" width="80" height="12" fill="#8d6e63" rx="2"/>
    <rect x="20" y="72" width="60" height="8" fill="#a1887f" rx="1"/>
    <!-- Ashoka Chakra Wheel -->
    <circle cx="50" cy="60" r="12" fill="#ffffff" stroke="#0e3d87" stroke-width="2"/>
    <circle cx="50" cy="60" r="3" fill="#0e3d87"/>
    <!-- Lions Silhouette -->
    <path d="M 30,50 C 25,35 30,20 50,15 C 70,20 75,35 70,50 C 65,45 60,40 50,42 C 40,40 35,45 30,50 Z" fill="#8d6e63" stroke="#4e342e" stroke-width="1.5"/>
  </g>

  <!-- B. Crossed Swords (Red Blades with Golden Hilts) -->
  <g id="crossedSwords">
    <!-- Sword 1 (Top-Left to Bottom-Right) -->
    <path d="M 125,125 L 275,275" stroke="#b71c1c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 125,125 L 275,275" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
    <polygon points="125,125 118,122 122,118" fill="#b71c1c"/>
    <!-- Guard & Hilt 1 -->
    <rect x="260" y="255" width="22" height="6" transform="rotate(45 271 258)" fill="#f59e0b" rx="2"/>
    <circle cx="275" cy="275" r="5" fill="#d97706"/>

    <!-- Sword 2 (Top-Right to Bottom-Left) -->
    <path d="M 275,125 L 125,275" stroke="#b71c1c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 275,125 L 125,275" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
    <polygon points="275,125 282,122 278,118" fill="#b71c1c"/>
    <!-- Guard & Hilt 2 -->
    <rect x="118" y="255" width="22" height="6" transform="rotate(-45 129 258)" fill="#f59e0b" rx="2"/>
    <circle cx="125" cy="275" r="5" fill="#d97706"/>
  </g>

  <!-- C. Blue Navy Anchor (Center Bottom) -->
  <g id="navyAnchor" transform="translate(160, 185)">
    <!-- Anchor Ring -->
    <circle cx="40" cy="15" r="8" fill="none" stroke="#0e3d87" stroke-width="4"/>
    <!-- Vertical Stock -->
    <rect x="37" y="20" width="6" height="50" fill="#0e3d87" rx="1"/>
    <!-- Horizontal Crossbar -->
    <rect x="20" y="32" width="40" height="5" fill="#0e3d87" rx="1"/>
    <!-- Curved Flukes -->
    <path d="M 15,50 C 15,80 65,80 65,50" fill="none" stroke="#0e3d87" stroke-width="7" stroke-linecap="round"/>
    <!-- Left Triangle Arrow -->
    <polygon points="15,45 8,55 22,55" fill="#0e3d87"/>
    <!-- Right Triangle Arrow -->
    <polygon points="65,45 58,55 72,55" fill="#0e3d87"/>
  </g>

  <!-- D. Blue Feathers / Air Force Wings (Spreading Left & Right) -->
  <g id="airForceWings">
    <!-- Left Wing Feathers -->
    <path d="M 190,200 Q 140,165 110,175 Q 140,185 160,195 Q 130,195 120,205 Q 150,205 190,210 Z" fill="#0288d1" stroke="#01579b" stroke-width="1"/>
    <path d="M 190,200 Q 150,150 100,165 Q 135,175 165,190 Q 120,180 115,190 Q 150,195 190,205 Z" fill="#29b6f6" opacity="0.9"/>

    <!-- Right Wing Feathers -->
    <path d="M 210,200 Q 260,165 290,175 Q 260,185 240,195 Q 270,195 280,205 Q 250,205 210,210 Z" fill="#0288d1" stroke="#01579b" stroke-width="1"/>
    <path d="M 210,200 Q 250,150 300,165 Q 265,175 235,190 Q 280,180 285,190 Q 250,195 210,205 Z" fill="#29b6f6" opacity="0.9"/>
  </g>

  <!-- E. Central Cogwheel / Sun (Science & Engineering Gear) -->
  <g id="centerGear" transform="translate(200, 205)">
    <!-- Gear teeth -->
    <circle cx="0" cy="0" r="22" fill="#5c6bc0" stroke="#3949ab" stroke-width="2"/>
    <!-- 8 Gear Teeth -->
    <rect x="-4" y="-26" width="8" height="52" fill="#5c6bc0" rx="1"/>
    <rect x="-4" y="-26" width="8" height="52" fill="#5c6bc0" rx="1" transform="rotate(45)"/>
    <rect x="-4" y="-26" width="8" height="52" fill="#5c6bc0" rx="1" transform="rotate(90)"/>
    <rect x="-4" y="-26" width="8" height="52" fill="#5c6bc0" rx="1" transform="rotate(135)"/>

    <!-- Inner Orange Sun Disk -->
    <circle cx="0" cy="0" r="16" fill="#f57c00" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- F. Devanagari Motto Ribbon Banner: "बलस्य मूलं विज्ञानम्" -->
  <g id="mottoBanner" transform="translate(200, 268)">
    <path d="M -75,0 Q 0,-8 75,0 Q 60,18 0,18 Q -60,18 -75,0 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="0" y="11" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#111111" letter-spacing="0.5">
      बलस्य मूलं विज्ञानम्
    </text>
  </g>

</svg>
